<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Item</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <header>
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <span class="logo-dot"></span>Swap<span>Hub</span>
    </a>
    <nav>
      <a href="index.html">Browse</a>
      <a href="my-requests.html">My Requests</a>
      <a href="post-item.html" class="btn-post">+ Post Item</a>
    </nav>
  </div>
</header>
 
<main>
  <div class="page-header">
    <h1>Post an Item</h1>
    <p>List something you own and tell the community what you'd like in return.</p>
  </div>
 
  <div class="form-card">
    <form id="post-form" novalidate>
      <div class="form-grid">

        <div class="form-group">
          <label for="item-title">Item Title *</label>
          <input type="text" id="item-title" placeholder="e.g. Sony WH-1000XM4 Headphones" maxlength="80" required />
        </div>
 
        <div class="form-group">
          <label for="item-desc">Description *</label>
          <textarea id="item-desc" placeholder="Describe your item — condition details, age, any defects, accessories included…" rows="4" required></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="item-category">Category *</label>
            <select id="item-category" required>
              <option value="">Select category…</option>
              <option value="Electronics">📱 Electronics</option>
              <option value="Fashion">👟 Fashion</option>
              <option value="Books">📚 Books</option>
              <option value="Furniture">🪑 Furniture</option>
              <option value="Sports">⚽ Sports</option>
              <option value="Gaming">🎮 Gaming</option>
              <option value="Toys">🧸 Toys</option>
              <option value="Other">📦 Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="item-condition">Condition *</label>
            <select id="item-condition" required>
              <option value="">Select condition…</option>
              <option value="New">✨ New / Like New</option>
              <option value="Used">🔧 Used</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="item-exchange">Looking to Exchange For *</label>
          <input type="text" id="item-exchange" placeholder="e.g. Mechanical Keyboard, Gaming Mouse, or similar" required />
        </div>

        <div class="form-group">
          <label>Item Photo (optional)</label>
          <div class="image-upload-area">
            <input type="file" id="item-image" accept="image/*" />
            <div class="upload-icon">📷</div>
            <div class="upload-text"><strong>Click to upload</strong> or drag and drop<br />PNG, JPG, WEBP up to 5MB</div>
          </div>
          <div id="image-preview">
            <img id="preview-img" src="" alt="Preview" />
          </div>
        </div>

        <div class="form-actions">
          <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">🚀 Post Item</button>
        </div>
 
      </div>
    </form>
  </div>
</main>
 
<footer>
  <span>SwapHub</span> · Built with 🔄 · Trade fairly, trade locally ·
  <a href="index.html">Browse items</a>
</footer>
 
<div id="toast" class="toast"></div>
 
<script src="js/data.js"></script>
<script src="js/post.js"></script>
</body>
</html>
